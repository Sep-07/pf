<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f2f4f7;
            margin: 0;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center
        }

        form {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            width: min(90vw, 340px);
            box-shadow: 0 2px 10px #0002
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            font-size: 16px;
            box-sizing: border-box
        }

        button {
            background: #1a5fb4;
            color: #fff;
            border: 0;
            border-radius: 8px
        }

        .e {
            color: #c01c28;
            margin-top: 12px
        }
    </style>
</head>

<body>
    <form method="post">
        <h2>Ingresar</h2>
        <input name="usu" placeholder="Usuario" required autofocus>
        <input name="clave" type="password" placeholder="Contraseña" required>
        {% if err %}<div class="e">{{ err }}</div>{% endif %}
        <button>Entrar</button>
    </form>
</body>

</html>
